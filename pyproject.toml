[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Constrained decoding for function calling"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.30.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pytest",
    "accelerate",
    "llm-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }
